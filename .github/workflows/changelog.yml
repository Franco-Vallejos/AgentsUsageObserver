name: Generate changelog & update releases.json

# Se dispara al empujar un tag, al publicar una release o manualmente.
on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a reflejar en releases.json (por ejemplo v0.1.3)'
        required: true
        type: string

permissions:
  contents: write   # commitear releases.json de vuelta a main
  models: read      # GitHub Models (inferencia gratis con github.token)
  actions: write    # disparar el deploy de Pages (workflow_dispatch)

# Un changelog a la vez.
concurrency:
  group: changelog-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver tag
        id: meta
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            release)
              TAG="${{ github.event.release.tag_name }}"
              ;;
            workflow_dispatch)
              TAG="${{ github.event.inputs.tag }}"
              ;;
            *)
              TAG="${GITHUB_REF_NAME}"
              ;;
          esac

          if [ -z "${TAG}" ]; then
            echo "No se pudo resolver el tag para el changelog." >&2
            exit 1
          fi

          case "${TAG}" in
            v*) ;;
            *)
              echo "El tag debe empezar con 'v'. Valor recibido: ${TAG}" >&2
              exit 1
              ;;
          esac

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout (con historia completa para el diff de commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main   # commiteamos sobre main, no sobre el tag (detached)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reunir commits desde el tag anterior
        id: commits
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          # Tag inmediatamente anterior a este (por fecha de creación).
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"   # primera release: todos los commits hasta el tag
          fi
          echo "Rango de commits: ${RANGE}"
          git log "${RANGE}" --no-merges --pretty=%s > commits.txt
          # Diff de código del rango, para que la IA entienda qué cambió de verdad.
          # Excluimos ruido pesado ya en git (el script filtra el resto y trunca).
          if [ -n "$PREV" ]; then
            git diff "${PREV}..${TAG}" -- . \
              ':(exclude)**/package-lock.json' \
              ':(exclude)web/dist/**' \
              ':(exclude)installer_output/**' > diff.txt || true
          else
            : > diff.txt   # primera release: sin diff base, va solo por commits
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "---- commits ----"
          cat commits.txt
          echo "---- diff (bytes) ----"
          wc -c < diff.txt

      - name: Generar changelog y actualizar releases.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/generate-changelog.mjs "${{ steps.commits.outputs.version }}" commits.txt diff.txt

      - name: Commit y push de releases.json
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- web/public/releases.json; then
            echo "Sin cambios en releases.json; nada que commitear."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add web/public/releases.json
          git commit -m "chore(release): actualizar releases.json para ${{ steps.meta.outputs.tag }}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # El push lo hace el GITHUB_TOKEN, y por diseño de GitHub eso NO dispara
      # otros workflows (anti-loops). Así que gatillamos el deploy de Pages a mano.
      - name: Redeploy de la web (Pages)
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
