name: Build & Release installer

# Se dispara al empujar un tag, al publicar una release o manualmente.
on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (por ejemplo v0.1.3)'
        required: true
        type: string

permissions:
  contents: write   # necesario para crear el Release y subir el .exe

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Resolver tag
        id: meta
        shell: pwsh
        run: |
          $eventName = '${{ github.event_name }}'
          if ($eventName -eq 'release') {
            $tag = '${{ github.event.release.tag_name }}'
          } elseif ($eventName -eq 'workflow_dispatch') {
            $tag = '${{ github.event.inputs.tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'No se pudo resolver el tag para la release.'
          }

          if (-not $tag.StartsWith('v')) {
            throw "El tag debe empezar con 'v'. Valor recibido: $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained, multi-file)
        run: dotnet publish AgentUsageObserver/AgentUsageObserver.csproj -c Release -r win-x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: installer_output/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
